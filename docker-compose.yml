services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: uy_precios
      POSTGRES_USER: uy_precios
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://uy_precios:${DB_PASSWORD}@db:5432/uy_precios
      SCRAPE_SCHEDULE_HOUR: ${SCRAPE_SCHEDULE_HOUR:-9}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
